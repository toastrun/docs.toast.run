name: Sync to site

on:
  push:
  workflow_dispatch:
    inputs:
      swow_ref:
        description: 'Extra Swow ref to publish, e.g. a branch or a tag'
        default: ''
        required: false
  repository_dispatch:
    types: [ update ]

jobs:
  sync:
    name: Sync to site
    runs-on: "ubuntu-latest"
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true
          working-directory: jekyll

      - name: Calculate composer hashes
        shell: bash
        id: hash
        working-directory: phpdoc2md
        run: |
          composer update --no-install
          printf "::set-output name=hash::"
          cat composer.lock | sha256sum | awk '{print $1}'

      - name: Cache composer
        uses: actions/cache@v3
        id: cache
        with:
          path: |
            phpdoc2md/vendor
          key: composer-v1-${{ steps.hash.outputs.hash }}

      - name: Prepare composer
        shell: bash
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: phpdoc2md
        run: |
          composer update -o

      # ci and develop, the latest release, and the two newest stable releases
      - name: Resolve versions
        shell: bash
        run: |
          gh api "repos/swow/swow/releases?per_page=30" --jq '
            [.[]|select(.draft==false)] as $all
            | [.[]|select(.prerelease==false)|.tag_name] as $stable
            | (["ci","develop"] + [$all[0].tag_name] + $stable[0:2])
            | reduce .[] as $ref ([]; if index($ref) then . else . + [$ref] end)
          ' > versions.json
          if [ -n "${{ github.event.inputs.swow_ref }}" ]; then
            jq --arg ref "${{ github.event.inputs.swow_ref }}" '. + [$ref] | unique' versions.json > versions.tmp
            mv versions.tmp versions.json
          fi
          cat versions.json

      # One shallow fetch per ref. The blob filter keeps the history of the
      # older refs almost free; git archive pulls the two directories later.
      - name: Fetch Swow sources
        shell: bash
        run: |
          git init -q swow-src
          cd swow-src
          git remote add origin https://github.com/swow/swow.git
          jq -r '.[]' ../versions.json | while read -r ref; do
            git fetch -q --depth 1 --filter=blob:none origin "$ref"
            mkdir -p "../src/$ref"
            git archive "$(git rev-parse FETCH_HEAD)" lib/swow-stub lib/swow-library \
              | tar -x -C "../src/$ref"
          done

      # The list is newest first: the two branches, the latest release, then the
      # two newest stable releases. The first three also go into the merged index.
      - name: Write versions data
        shell: bash
        run: |
          jq 'to_entries | map({
                ref: .value,
                label: (.value | sub("^v"; "")),
                search: (.key < 3)
              })' versions.json > jekyll/_data/versions.json
          cat jekyll/_data/versions.json

      # The versions are newest first, and the sidebar keeps that order
      - name: Build API pages
        shell: bash
        run: |
          order=1
          jq -r '.[] | "\(.ref) \(.label)"' jekyll/_data/versions.json \
          | while read -r ref label; do
              php phpdoc2md/bin/phpdoc2md.php "src/$ref" "jekyll/swow-api/$ref" \
                --version="$ref" --label="$label" --order="$order"
              order=$((order + 1))
            done

      - name: Build site
        shell: bash
        run: |
          cd jekyll
          bundle exec jekyll build

      - name: Sync to site
        shell: bash
        run: |
          # prepare ssh
          umask 077
          mkdir -p ~/.ssh
          cat > ~/.ssh/id_ed25519 <<SSHKEY
          ${{ secrets.SITE_SSH_KEY }}
          SSHKEY
          cat > ~/.ssh/known_hosts <<SSHPUBKEY
          ${{ secrets.SITE_PUB_KEY }}
          SSHPUBKEY

          cd jekyll/_site
          echo '9f06b4f335bf2e3b6adf7d01abd31e07' > ./baidu_verify_codeva-gcshIa1uCm.html
          rsync -rvz . "${{ secrets.REMOTE_PATH }}"

          rm -r ~/.ssh
